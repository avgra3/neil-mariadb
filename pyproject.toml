[project]
name = "neil"
version = "0.4.2"
description = "Execute SQL scripts through MariaDB with captured output."
readme = "README.md"
authors = [
    { name = "avgra3", email = "antonygradillas@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mariadb>=1.1.14, <2.0.0",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
keywords = ["mariadb", "sql"]

classifiers = [
  "Intended Audience :: Developers",
  "Topic :: Software Development :: Build Tools",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Homepage = "https://github.com/avgra3/neil-mariadb"
Repository = "https://github.com/avgra3/neil-mariadb"
Issues = "https://github.com/avgra3/neil-mariadb/issues"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "ty>=0.0.60",
]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra", "-q"]
testpaths = [
    "tests",
    "integration",
]

[tool.ruff]
line-length = 80

[tool.ruff.lint]
extend-select = ["E501"]

